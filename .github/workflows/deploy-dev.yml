name: Deploy to Development Server

on:
  push:
    branches:
      - release

jobs:
  deploy:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest

    steps:
      - name: Sunucuya Bağlan ve Dağıtımı Tetikle
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_HOST }} # Artık ssh.okanacer.xyz'e bağlanacak
          username: ${{ secrets.DEV_USERNAME }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEV_PORT }}
          script: |
            # --- BACKEND DAĞITIMI ---
            echo "====== BACKEND DAĞITIMI BAŞLIYOR ======"
            cd /home/acrtech/apps/aj-server-dev || exit 1
            echo "1/4: Son değişiklikler 'release' branch'inden çekiliyor..."
            git pull origin release
            echo "2/4: Backend Maven ile build ediliyor..."
            ./mvnw clean package -DskipTests
            echo "3/4: Backend servisi yeniden başlatılıyor..."
            sudo systemctl restart aj-server-dev
            echo "4/4: Backend dağıtımı tamamlandı."
            echo ""
            
            # --- FRONTEND DAĞITIMI ---
            echo "====== FRONTEND DAĞITIMI BAŞLIYOR ======"
            cd /home/acrtech/apps/aj-client-dev || exit 1
            echo "1/5: Son değişiklikler 'release' branch'inden çekiliyor..."
            git pull origin release
            echo "2/5: Frontend bağımlılıkları yükleniyor..."
            npm install
            echo "3/5: Frontend Next.js ile build ediliyor..."
            npm run build
            echo "4/5: Frontend servisi yeniden başlatılıyor..."
            pm2 restart aj-client-dev || pm2 start npm --name "aj-client-dev" -- run start -- -p 3011
            echo "5/5: Frontend dağıtımı tamamlandı."