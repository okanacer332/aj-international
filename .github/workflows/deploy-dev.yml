name: Deploy to Development Server

on:
  push:
    branches:
      - release

jobs:
  build-and-deploy:
    name: Build and Deploy to Dev Server
    runs-on: ubuntu-latest

    steps:
      - name: 1. Kodu İndir (Checkout)
        uses: actions/checkout@v4

      - name: 2. Java JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 3. Backend'i Maven ile Build Et
        run: ./mvnw clean package -DskipTests
        working-directory: ./aj-server

      - name: 4. Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aj-client/package-lock.json

      - name: 5. Frontend Bağımlılıklarını Yükle
        run: npm install
        working-directory: ./aj-client

      - name: 6. Frontend'i Build Et
        run: npm run build
        working-directory: ./aj-client

      - name: 7. Cloudflared Aracını Kur
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: 8. Dosyaları Sunucuya Kopyala (Tünel Üzerinden)
        uses: appleboy/scp-action@master # <-- VERSİYON DÜZELTİLDİ
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USERNAME }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEV_PORT }}
          source: "aj-server/target/*.jar,aj-client/.next,aj-client/public,aj-client/package.json,aj-client/next.config.mjs"
          target: "~/apps/deployment-temp"
          strip_components: 1
          command_timeout: 2m # Zaman aşımı süresini uzatalım
          proxy_command: "/usr/local/bin/cloudflared access ssh --hostname ${{ secrets.DEV_HOST }}"

      - name: 9. Sunucuda Dağıtımı Tamamla (Tünel Üzerinden)
        uses: appleboy/ssh-action@master # <-- VERSİYON DÜZELTİLDİ
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USERNAME }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEV_PORT }}
          command_timeout: 2m # Zaman aşımı süresini uzatalım
          proxy_command: "/usr/local/bin/cloudflared access ssh --hostname ${{ secrets.DEV_HOST }}"
          script: |
            # Backend'i güncelle
            mkdir -p ~/apps/aj-server-dev
            mv -f ~/apps/deployment-temp/*.jar ~/apps/aj-server-dev/app.jar
            sudo systemctl restart aj-server-dev
            
            # Frontend'i güncelle
            mkdir -p ~/apps/aj-client-dev
            rsync -a --delete ~/apps/deployment-temp/.next/ ~/apps/aj-client-dev/.next/
            rsync -a --delete ~/apps/deployment-temp/public/ ~/apps/aj-client-dev/public/
            cp ~/apps/deployment-temp/package.json ~/apps/aj-client-dev/
            cp ~/apps/deployment-temp/next.config.mjs ~/apps/aj-client-dev/
            
            cd ~/apps/aj-client-dev
            pm2 restart aj-client-dev || pm2 start npm --name "aj-client-dev" -- run start -- -p 3011
            
            # Geçici dosyaları temizle
            rm -rf ~/apps/deployment-temp