name: Deploy to Development Server

on:
  push:
    branches:
      - release

jobs:
  deploy:
    name: Build and Deploy to Dev Server
    runs-on: ubuntu-latest

    steps:
      # --- 1. Adım: Kodu GitHub Actions sunucusuna indir ---
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 2. Adım: Java (Backend) Kurulumu ve Build ---
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backend with Maven
        run: ./mvnw -f aj-server/pom.xml clean package -DskipTests

      # --- 3. Adım: Node.js (Frontend) Kurulumu ve Build ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # veya projenin kullandığı versiyon
          cache: 'npm'
          cache-dependency-path: aj-client/package-lock.json

      - name: Install Frontend Dependencies
        run: npm install --prefix aj-client

      - name: Build Frontend
        run: npm run build --prefix aj-client

      # --- 4. Adım: Dosyaları Sunucuya Kopyalama (SCP) ---
      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USERNAME }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEV_PORT }}
          source: "aj-server/target/*.jar,aj-client/.next,aj-client/public,aj-client/package.json,aj-client/next.config.mjs"
          target: "~/apps/deployment-temp"
          strip_components: 1

      # --- 5. Adım: Sunucuda Dağıtımı Tamamlama (SSH) ---
      - name: Deploy on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USERNAME }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEV_PORT }}
          script: |
            # Backend'i güncelle
            mkdir -p ~/apps/aj-server-dev
            mv ~/apps/deployment-temp/*.jar ~/apps/aj-server-dev/app.jar
            sudo systemctl restart aj-server-dev
            
            # Frontend'i güncelle
            mkdir -p ~/apps/aj-client-dev
            rsync -a --delete ~/apps/deployment-temp/.next/ ~/apps/aj-client-dev/.next/
            rsync -a --delete ~/apps/deployment-temp/public/ ~/apps/aj-client-dev/public/
            cp ~/apps/deployment-temp/package.json ~/apps/aj-client-dev/
            cp ~/apps/deployment-temp/next.config.mjs ~/apps/aj-client-dev/
            
            cd ~/apps/aj-client-dev
            pm2 restart aj-client-dev || pm2 start npm --name "aj-client-dev" -- run start -- -p 3011
            
            # Geçici dosyaları temizle
            rm -rf ~/apps/deployment-temp