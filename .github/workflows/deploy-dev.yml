name: Deploy to Development Server

# Bu workflow'un ne zaman çalışacağını belirler: 'release' branch'ine push yapıldığında
on:
  push:
    branches:
      - release

jobs:
  deploy-backend:
    name: Deploy Backend to Dev
    runs-on: ubuntu-latest # GitHub'ın bize sağladığı sanal sunucu

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USERNAME }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEV_PORT }}
          script: |
            # Geliştirme ortamı backend klasörüne git
            cd /home/acrtech/apps/aj-server-dev
            
            # Koddaki son değişiklikleri çek
            git checkout release
            git pull origin release
            
            # Projeyi build et (testleri atla)
            ./mvnw clean package -DskipTests
            
            # Servisi yeniden başlat
            sudo systemctl restart aj-server-dev

  deploy-frontend:
    name: Deploy Frontend to Dev
    runs-on: ubuntu-latest
    needs: deploy-backend # Backend'in başarılı olmasını bekle (isteğe bağlı, kaldırılabilir)

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USERNAME }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEV_PORT }}
          script: |
            # Geliştirme ortamı frontend klasörüne git
            cd /home/acrtech/apps/aj-client-dev
            
            # Koddaki son değişiklikleri çek
            git checkout release
            git pull origin release
            
            # Gerekli paketleri yükle
            npm install
            
            # Uygulamayı yeniden başlat
            pm2 restart aj-client-dev