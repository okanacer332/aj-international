# Docker Profile Configuration
# This file is used when SPRING_PROFILES_ACTIVE=docker

# MongoDB (Docker network)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/ajinternational}

# Redis (Docker network)
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.cache.redis.time-to-live=3600000

# Actuator Endpoints for Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# Server Configuration
server.port=8080
server.compression.enabled=true

# JWT Secret (base64 encoded, 256-bit key)
jwt.secret=${JWT_SECRET:c3VwZXJTZWN1cmVKd3RTZWNyZXRLZXlGb3JBakludGVybmF0aW9uYWxBcHBsaWNhdGlvbjIwMjQ=}
jwt.expiration=86400000
