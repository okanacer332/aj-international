# Performance Optimization Configuration for Nginx
# Add these settings to your nginx server block

# Gzip Compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/x-javascript
    application/x-font-ttf
    application/vnd.ms-fontobject
    font/opentype
    font/ttf
    image/svg+xml
    image/x-icon;
gzip_disable "MSIE [1-6]\.";

# Brotli Compression (requires nginx-brotli module)
# Uncomment if brotli module is installed
# brotli on;
# brotli_comp_level 6;
# brotli_static on;
# brotli_types
#     text/plain
#     text/css
#     text/xml
#     text/javascript
#     application/json
#     application/javascript
#     application/xml
#     application/xml+rss
#     image/svg+xml;

# Static Asset Caching
location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|woff|woff2|ttf|svg|eot)$ {
    expires 30d;
    add_header Cache-Control "public, no-transform";
    add_header Vary Accept-Encoding;
    access_log off;
}

# Next.js Static Files
location /_next/static/ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# Next.js Image Optimization
location /_next/image {
    expires 60d;
    add_header Cache-Control "public, max-age=5184000";
}

# API Rate Limiting (optional)
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# location /api/ {
#     limit_req zone=api_limit burst=20 nodelay;
#     proxy_pass http://backend;
# }

# WebSocket Upgrade
location /ws {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# Security Headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Connection Settings
keepalive_timeout 65;
keepalive_requests 100;

# Buffer Settings
client_body_buffer_size 16k;
client_max_body_size 50M;
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;
