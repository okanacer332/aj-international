# Prometheus Configuration for AJ International
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'aj-international'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: []

# Rule files (optional)
# rule_files:
#   - "rules/*.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Spring Boot Application (aj-server)
  - job_name: 'aj-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['aj-server:8080']
    scrape_interval: 10s

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # MongoDB Exporter
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']
